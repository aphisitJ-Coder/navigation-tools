<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Circle Checker - Deg/Min</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-4xl w-full bg-white shadow-2xl rounded-3xl overflow-hidden flex flex-col md:flex-row">
        
        <div class="md:w-1/2 p-8 bg-slate-800 text-white">
            <h2 class="text-xl font-bold mb-6 text-blue-400 border-b border-slate-700 pb-2 uppercase">Input Data (Position A)</h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Latitude A</label>
                    <div class="flex gap-2">
                        <input type="number" id="latDeg" placeholder="Deg" class="w-20 bg-slate-700 p-2 rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="number" id="latMin" placeholder="Min" step="0.01" class="flex-1 bg-slate-700 p-2 rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                        <select id="nsA" class="bg-slate-600 p-2 rounded outline-none">
                            <option value="1">N</option>
                            <option value="-1">S</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Longitude A</label>
                    <div class="flex gap-2">
                        <input type="number" id="longDeg" placeholder="Deg" class="w-20 bg-slate-700 p-2 rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="number" id="longMin" placeholder="Min" step="0.01" class="flex-1 bg-slate-700 p-2 rounded text-center focus:ring-2 focus:ring-blue-500 outline-none">
                        <select id="ewA" class="bg-slate-600 p-2 rounded outline-none">
                            <option value="1">E</option>
                            <option value="-1">W</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Initial Course</label>
                        <input type="number" id="course" placeholder="deg (T)" class="w-full bg-slate-700 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Distance</label>
                        <input type="number" id="dist" placeholder="nm" class="w-full bg-slate-700 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="flex flex-col gap-3 pt-4">
                    <button onclick="calculate()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95">
                        CALCULATE FINAL POSITION
                    </button>
                    <button onclick="clearFields()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 rounded-xl transition-colors text-sm">
                        CLEAR ALL DATA
                    </button>
                </div>
            </div>
        </div>

        <div class="md:w-1/2 p-8 bg-white flex flex-col justify-center">
            <h2 class="text-xl font-bold mb-8 text-slate-800 border-b pb-2 uppercase">Result (Position B)</h2>
            
            <div id="resultArea" class="hidden space-y-8">
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Final Latitude</p>
                    <div class="text-3xl font-mono font-bold text-slate-800" id="resLat">--</div>
                </div>
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Final Longitude</p>
                    <div class="text-3xl font-mono font-bold text-slate-800" id="resLong">--</div>
                </div>
            </div>

            <div id="placeholder" class="text-center text-slate-300 py-20 italic">
                <p>ป้อนข้อมูลพิกัด A เพื่อเริ่มคำนวณ...</p>
            </div>
        </div>
    </div>

    <script>
        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        function formatDMS(dd, type) {
            const absDd = Math.abs(dd);
            const deg = Math.floor(absDd);
            const min = ((absDd - deg) * 60).toFixed(2);
            let suffix = "";
            if (type === 'lat') suffix = dd >= 0 ? "N" : "S";
            else suffix = dd >= 0 ? "E" : "W";
            
            return `${deg}° ${min}' ${suffix}`;
        }

        function calculate() {
            const latD = parseFloat(document.getElementById('latDeg').value || 0);
            const latM = parseFloat(document.getElementById('latMin').value || 0);
            const latA = (latD + (latM / 60)) * parseFloat(document.getElementById('nsA').value);

            const longD = parseFloat(document.getElementById('longDeg').value || 0);
            const longM = parseFloat(document.getElementById('longMin').value || 0);
            const longA = (longD + (longM / 60)) * parseFloat(document.getElementById('ewA').value);

            const course = parseFloat(document.getElementById('course').value || 0);
            const distNm = parseFloat(document.getElementById('dist').value || 0);

            if (distNm === 0 && course === 0 && latD === 0 && longD === 0) {
                alert("กรุณากรอกข้อมูลก่อนคำนวณ");
                return;
            }

            const phi1 = toRad(latA);
            const lam1 = toRad(longA);
            const tc = toRad(course);
            const d = toRad(distNm / 60);

            const phi2 = Math.asin(Math.sin(phi1) * Math.cos(d) + Math.cos(phi1) * Math.sin(d) * Math.cos(tc));
            let lam2 = lam1 + Math.atan2(Math.sin(tc) * Math.sin(d) * Math.cos(phi1), Math.cos(d) - Math.sin(phi1) * Math.sin(phi2));
            lam2 = (lam2 + 3 * Math.PI) % (2 * Math.PI) - Math.PI;

            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            document.getElementById('resLat').innerText = formatDMS(toDeg(phi2), 'lat');
            document.getElementById('resLong').innerText = formatDMS(toDeg(lam2), 'long');
        }

        function clearFields() {
            // ล้างค่าใน input ทั้งหมด
            const inputs = ['latDeg', 'latMin', 'longDeg', 'longMin', 'course', 'dist'];
            inputs.forEach(id => document.getElementById(id).value = '');
            
            // รีเซ็ต select
            document.getElementById('nsA').value = "1";
            document.getElementById('ewA').value = "1";

            // รีเซ็ตหน้าจอแสดงผล
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
        }
    </script>
</body>
</html>
