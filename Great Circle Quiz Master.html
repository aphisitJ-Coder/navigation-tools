<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Circle Navigation Trainer (DMS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Chakra Petch', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 uppercase tracking-widest">Great Circle Quiz Master</h1>
            <p class="text-slate-400">ฝึกคำนวณหาพิกัดปลายทางด้วยหน่วย องศา และลิปดา</p>
        </div>

        <div class="bg-slate-800 border-2 border-blue-500/30 rounded-2xl p-6 shadow-2xl mb-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <span class="bg-blue-600 text-[10px] px-3 py-1 rounded-full uppercase font-bold tracking-tighter">Current Challenge</span>
                <button onclick="generateQuestion()" class="text-sm text-blue-400 hover:text-blue-200 transition flex items-center gap-2">
                    🔄 สุ่มโจทย์ใหม่
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                <div class="p-4 bg-slate-700/50 rounded-lg border border-slate-600">
                    <p class="text-xs text-slate-400 mb-1 uppercase font-bold">Position A</p>
                    <p id="displayPosA" class="text-lg font-bold text-white">-</p>
                </div>
                <div class="p-4 bg-slate-700/50 rounded-lg border border-slate-600">
                    <p class="text-xs text-slate-400 mb-1 uppercase font-bold">Initial Course (C)</p>
                    <p id="displayCourse" class="text-lg font-bold text-yellow-400">-</p>
                </div>
                <div class="p-4 bg-slate-700/50 rounded-lg border border-slate-600">
                    <p class="text-xs text-slate-400 mb-1 uppercase font-bold">Distance (d)</p>
                    <p id="displayDist" class="text-lg font-bold text-green-400">-</p>
                </div>
            </div>
        </div>

        <div class="bg-white text-slate-900 rounded-2xl p-6 shadow-xl">
            <h3 class="font-bold mb-6 text-lg border-b pb-2 flex items-center gap-2">
                ✍️ กรอกคำตอบของคุณ (Position B)
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-600 uppercase">Latitude B</label>
                    <div class="flex gap-2">
                        <input type="number" id="ansLatDeg" placeholder="Deg" class="w-20 border-2 border-slate-200 rounded p-2 text-center outline-none focus:border-blue-500">
                        <input type="number" id="ansLatMin" placeholder="Min" step="0.1" class="flex-1 border-2 border-slate-200 rounded p-2 text-center outline-none focus:border-blue-500">
                        <select id="ansNS" class="border-2 border-slate-200 rounded p-2 bg-slate-50 font-bold">
                            <option value="N">N</option>
                            <option value="S">S</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-600 uppercase">Longitude B</label>
                    <div class="flex gap-2">
                        <input type="number" id="ansLongDeg" placeholder="Deg" class="w-20 border-2 border-slate-200 rounded p-2 text-center outline-none focus:border-blue-500">
                        <input type="number" id="ansLongMin" placeholder="Min" step="0.1" class="flex-1 border-2 border-slate-200 rounded p-2 text-center outline-none focus:border-blue-500">
                        <select id="ansEW" class="border-2 border-slate-200 rounded p-2 bg-slate-50 font-bold">
                            <option value="E">E</option>
                            <option value="W">W</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <button onclick="checkAnswer()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg active:scale-95 text-lg">
                ตรวจสอบคำตอบ
            </button>

            <div id="feedback" class="mt-6 hidden">
                <div id="feedbackBox" class="p-4 rounded-lg border-2 mb-4 transition-all">
                    <p id="feedbackText" class="font-bold text-center text-lg"></p>
                </div>
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                    <p class="text-xs font-black text-slate-400 mb-3 uppercase tracking-tighter">Calculation Solution (เฉลยขั้นตอนการคิด):</p>
                    <div id="solution" class="text-sm font-mono text-slate-700 space-y-2 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQ = {};

        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }

        // ฟังก์ชันช่วยแสดงผลจาก Decimal เป็น Degree/Minute
        function formatDMS(dd, type) {
            const absDd = Math.abs(dd);
            const deg = Math.floor(absDd);
            const min = ((absDd - deg) * 60).toFixed(1);
            let suffix = "";
            if (type === 'lat') suffix = dd >= 0 ? "N" : "S";
            else suffix = dd >= 0 ? "E" : "W";
            return `${deg}° ${min}' ${suffix}`;
        }

        function generateQuestion() {
            // สุ่มพิกัดแบบ องศา และ ลิปดา
            const latDeg = Math.floor(Math.random() * 120 - 60); // -60 ถึง 60
            const latMin = (Math.random() * 60).toFixed(1);
            const latA = latDeg + (parseFloat(latMin) / 60 * (latDeg >= 0 ? 1 : -1));

            const longDeg = Math.floor(Math.random() * 360 - 180); // -180 ถึง 180
            const longMin = (Math.random() * 60).toFixed(1);
            const longA = longDeg + (parseFloat(longMin) / 60 * (longDeg >= 0 ? 1 : -1));

            const course = Math.floor(Math.random() * 360);
            const dist = Math.floor(Math.random() * 4500 + 500);

            currentQ = { latA, longA, course, dist };

            document.getElementById('displayPosA').innerText = `${formatDMS(latA, 'lat')}, ${formatDMS(longA, 'long')}`;
            document.getElementById('displayCourse').innerText = `${course.toString().padStart(3, '0')}° (T)`;
            document.getElementById('displayDist').innerText = `${dist} nm`;
            
            // Clear inputs and UI
            document.getElementById('feedback').classList.add('hidden');
            const inputs = ['ansLatDeg', 'ansLatMin', 'ansLongDeg', 'ansLongMin'];
            inputs.forEach(id => document.getElementById(id).value = '');
        }

        function checkAnswer() {
            // รับค่าจากนักเรียน
            const uLatDeg = parseFloat(document.getElementById('ansLatDeg').value || 0);
            const uLatMin = parseFloat(document.getElementById('ansLatMin').value || 0);
            const uLat = (uLatDeg + (uLatMin / 60)) * (document.getElementById('ansNS').value === 'N' ? 1 : -1);

            const uLongDeg = parseFloat(document.getElementById('ansLongDeg').value || 0);
            const uLongMin = parseFloat(document.getElementById('ansLongMin').value || 0);
            const uLong = (uLongDeg + (uLongMin / 60)) * (document.getElementById('ansEW').value === 'E' ? 1 : -1);

            // คำนวณหาพิกัดจริง
            const phi1 = toRad(currentQ.latA);
            const lam1 = toRad(currentQ.longA);
            const brng = toRad(currentQ.course);
            const d_r = toRad(currentQ.dist / 60);

            const phi2 = Math.asin(Math.sin(phi1) * Math.cos(d_r) + Math.cos(phi1) * Math.sin(d_r) * Math.cos(brng));
            let lam2 = lam1 + Math.atan2(Math.sin(brng) * Math.sin(d_r) * Math.cos(phi1), Math.cos(d_r) - Math.sin(phi1) * Math.sin(phi2));
            lam2 = (lam2 + 3 * Math.PI) % (2 * Math.PI) - Math.PI;

            const correctLat = toDeg(phi2);
            const correctLong = toDeg(lam2);

            // ตรวจสอบ (ยอมรับความคลาดเคลื่อน 0.1 ลิปดา หรือประมาณ 0.0016 องศา)
            const isCorrect = (Math.abs(uLat - correctLat) < 0.016) && (Math.abs(uLong - correctLong) < 0.016);

            showFeedback(isCorrect, correctLat, correctLong);
        }

        function showFeedback(isCorrect, cLat, cLong) {
            const fb = document.getElementById('feedback');
            const fbBox = document.getElementById('feedbackBox');
            const fbText = document.getElementById('feedbackText');
            const sol = document.getElementById('solution');

            fb.classList.remove('hidden');
            if (isCorrect) {
                fbBox.className = "p-4 rounded-lg border-2 mb-4 bg-green-100 border-green-500 text-green-700 shadow-inner";
                fbText.innerText = "✅ คำตอบถูกต้อง! ยอดเยี่ยมมาก";
            } else {
                fbBox.className = "p-4 rounded-lg border-2 mb-4 bg-red-100 border-red-500 text-red-700 shadow-inner";
                fbText.innerText = "❌ ยังไม่ถูกต้อง ลองตรวจสอบการคำนวณอีกครั้ง";
            }

            sol.innerHTML = `
                <div class="border-b pb-2 mb-2"><span class="text-blue-600 font-bold">Step 1:</span> แปลงระยะทาง (d) เป็นองศา = ${currentQ.dist} / 60 = <span class="font-bold">${(currentQ.dist/60).toFixed(4)}°</span></div>
                <div class="border-b pb-2 mb-2"><span class="text-blue-600 font-bold">Step 2:</span> ใช้สูตร Spherical Cosine Law เพื่อหา Lat B และ DLo</div>
                <div class="grid grid-cols-1 gap-2 bg-white p-3 rounded shadow-sm border border-slate-200">
                    <div><span class="text-slate-500 font-bold uppercase text-[10px]">Correct Latitude B:</span> <br><span class="text-lg font-bold text-slate-800">${formatDMS(cLat, 'lat')}</span></div>
                    <div><span class="text-slate-500 font-bold uppercase text-[10px]">Correct Longitude B:</span> <br><span class="text-lg font-bold text-slate-800">${formatDMS(cLong, 'long')}</span></div>
                </div>
            `;
        }

        // เริ่มต้น
        generateQuestion();
    </script>
</body>
</html>
